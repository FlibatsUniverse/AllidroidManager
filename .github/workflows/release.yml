name: Allidroid Manager Release
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: Version name, for example 1.2.0
        required: true
      versionCode:
        description: Version code, for example 1200
        required: true
permissions:
  contents: read
concurrency:
  group: manager-release
  cancel-in-progress: false
jobs:
  release:
    name: Build and publish
    if: github.repository == 'FlibatsUniverse/AllidroidManager'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ inputs.versionName }}
      VERSION_CODE: ${{ inputs.versionCode }}
    steps:
      - name: Validate version
        run: |
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'versionName must look like 1.2.0'; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo 'versionCode must be a number'; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: 17
          distribution: temurin
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda
      - name: Set version
        run: |
          sed -i "s/versionCode = [0-9]*/versionCode = $VERSION_CODE/; s/versionName = \"[^\"]*\"/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts
      - name: Build signed APK
        env:
          KEYSTORE: ${{ secrets.keystore }}
          KEYSTORE_PASSWORD: ${{ secrets.keystore_password }}
          KEY_ALIAS: ${{ secrets.key_alias }}
          KEY_PASSWORD: ${{ secrets.key_password }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/signing-key.jks"
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/signing-key.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          mv app/build/outputs/apk/release/app-release.apk AllidroidManager.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" AllidroidManager.apk \
            --target "$GITHUB_SHA" \
            --title "Allidroid Manager v$VERSION_NAME" \
            --generate-notes
